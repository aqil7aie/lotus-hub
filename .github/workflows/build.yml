name: Build APKs
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 9.3.1
      - run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: lotus-shell-debug
          path: app/build/outputs/apk/debug/*.apk
# Release signing: keystore backed up at ~/workspace/lotus-shell/keys/
# lotus-shell.keystore (0600, Lotus VM); passwords live ONLY in repo
# secrets, never in chat or files.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 9.3.1
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > /tmp/lotus-shell.keystore
      - name: Build release APK
        env:
          KEYSTORE_FILE: /tmp/lotus-shell.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: lotus-shell-release
          path: app/build/outputs/apk/release/*.apk
