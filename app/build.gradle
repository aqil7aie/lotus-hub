plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.aqil.lotusshell"
    compileSdk 37

    defaultConfig {
        applicationId "com.aqil.lotusshell"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    // Latest stable GeckoView, verified from Mozilla's maven metadata
    // (last updated 2026-10-21). Single artifact, no per-arch flavors.
    implementation "org.mozilla.geckoview:geckoview:158.0.20261021001945"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"
}
