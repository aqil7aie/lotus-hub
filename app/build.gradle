plugins {
    id "com.android.application"
    // No kotlin-android plugin: AGP 9 provides Kotlin itself.
}

android {
    namespace "com.aqil.lotusshell"
    compileSdk 37

    defaultConfig {
        applicationId "com.aqil.lotusshell"
        minSdk 26 // GeckoView 158 requires at least 26 (Android 8.0)
        targetSdk 35
        versionCode 14
        versionName "0.5.0"
        // arm64-v8a only: Aqil's phone is arm64, and GeckoView ships
        // ~170MB of native libs PER ABI — a universal APK was 507MB.
        // arm64-only lands near ~180MB. Other ABIs can return later.
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_FILE") ?: "../keys/lotus-shell.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
            keyAlias System.getenv("KEY_ALIAS") ?: "lotusshell"
            keyPassword System.getenv("KEY_PASSWORD") ?: ""
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // No kotlinOptions block: AGP 9's built-in Kotlin support derives the
    // JVM target from compileOptions above.
}

configurations.all {
    resolutionStrategy {
        // GeckoView's tree pulls kotlin-stdlib 2.4.20, but AGP 9.1's
        // bundled Kotlin compiler is 2.2.0 and cannot read metadata
        // 2.4.0. A plain constraint did NOT downgrade it (Gradle picks
        // the highest version) — force is the tool that actually does.
        force "org.jetbrains.kotlin:kotlin-stdlib:2.2.10"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.2.10"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.10"
    }
}

dependencies {
    // Latest stable GeckoView, verified from Mozilla's maven metadata
    // (last updated 2026-10-21). Single artifact, no per-arch flavors.
    // Kotlin stdlib comes from AGP 9's built-in Kotlin support — no
    // explicit stdlib line, to avoid version fights with it.
    implementation "org.mozilla.geckoview:geckoview:158.0.20261021001945"
}
